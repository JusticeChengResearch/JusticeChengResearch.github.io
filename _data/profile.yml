short_bio: |
  <p class="bio-lead">
    Mixed-methods researcher in <strong>Human–AI Interaction</strong> and PhD student in the
    <a href="https://www.feng-ji.org/home" target="_blank">Psychometrics and Responsible AI Lab</a>
    (Dr. Feng Ji), University of Toronto.
  </p>
  <p class="mb-2">I study:</p>
  <ul class="bio-list">
    <li><i class="fas fa-brain fa-fw"></i><div><strong>Learning with AI</strong> — how people learn with and shape AI, and how AI in turn influences human learning, cognition, and behavior.</div></li>
    <li><i class="fas fa-user-check fa-fw"></i><div><strong>User experience of AI</strong> — how people relate to the AI tools they use, from psychological ownership to reliance.</div></li>
    <li><i class="fas fa-screwdriver-wrench fa-fw"></i><div><strong>Research into practice</strong> — designing and prototyping human-centered AI applications with software developers.</div></li>
  </ul>
  <div class="bio-goal">
    Bridging empirical research and system design to create AI experiences that are
    <strong>intuitive, effective, and responsible</strong>.
  </div>
  <div class="bio-tags">
    <span>Human–AI Interaction</span><span>Learning Sciences</span><span>Psychometrics</span><span>Psychological Ownership</span><span>AI Reliance</span>
  </div>

